[project]
name = "ytmusic-sidecar"
version = "0.1.0"
description = "A sidecar for SetlisteR to interact with YouTube Music API"
requires-python = ">=3.9"
dependencies = [
    "ytmusicapi",
    "pyinstaller",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "auth", "playlist"]
