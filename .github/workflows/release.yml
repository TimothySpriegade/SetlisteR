name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build — ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: SetlisteR
            artifact_name: setlister-linux-x86_64
            archive_ext: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: SetlisteR
            artifact_name: setlister-macos-aarch64
            archive_ext: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: SetlisteR.exe
            artifact_name: setlister-windows-x86_64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: ytmusic_sidecar/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('ytmusic_sidecar/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync Python dependencies
        working-directory: ytmusic_sidecar
        run: uv sync

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -czf dist/${{ matrix.artifact_name }}.tar.gz \
            -C dist ${{ matrix.binary }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" -Destination "dist\"
          Compress-Archive `
            -Path "dist\${{ matrix.binary }}" `
            -DestinationPath "dist\${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SetlisteR ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/*
